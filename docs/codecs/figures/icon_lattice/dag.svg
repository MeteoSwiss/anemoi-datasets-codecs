<text x="712" y="269" font-size="12.5" fill="#1f2328">parallel; the ranges of a</text>
<text x="712" y="286" font-size="12.5" fill="#1f2328">step run as a taskloop</text>
<text x="712" y="303" font-size="12.5" fill="#1f2328"></text>
