<svg xmlns="http://www.w3.org/2000/svg" width="900" height="624" viewBox="0 0 900 624" font-family="sans-serif">
<title>The error bound of field_terms</title>
<defs><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#57606a"/></marker></defs>
<rect x="0" y="0" width="900" height="624" fill="#ffffff"/>
<text x="20" y="28" font-size="14" fill="#1f2328" font-weight="bold">(a)  cell 10 of the T_2M slice, in units of b = 0.05 K (b_L = b (1 − m), m = 2^−6)</text>
<text x="20" y="58" font-size="13" fill="#1f2328">what the codec after the stage may return: any float32 r' with |r' − r| ≤ b_L</text>
<rect x="154.7" y="91" width="590.6" height="26" fill="#d1dfef" stroke="#2f6db5" stroke-width="1.2"/>
<path d="M60,104 L840,104" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<path d="M150,100 L150,108" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<text x="146" y="124" font-size="12" fill="#57606a" text-anchor="end">−1 b</text>
<path d="M750,100 L750,108" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<text x="754" y="124" font-size="12" fill="#57606a">+1 b</text>
<text x="840" y="124" font-size="12.5" fill="#57606a" text-anchor="end">r' − r</text>
<path d="M154.7,86 L154.7,122" fill="none" stroke="#2f6db5" stroke-width="2"/>
<text x="154.7" y="82" font-size="13" fill="#2f6db5" text-anchor="middle" font-weight="bold">lo</text>
<path d="M745.3,86 L745.3,122" fill="none" stroke="#2f6db5" stroke-width="2"/>
<text x="745.3" y="82" font-size="13" fill="#2f6db5" text-anchor="middle" font-weight="bold">hi</text>
<circle cx="450" cy="104" r="5" fill="#1f2328" stroke="none" stroke-width="1.0"/>
<text x="450" y="84" font-size="12.5" fill="#1f2328" text-anchor="middle">r = fl32(x − pred) = −0.72824097 K</text>
<path d="M154.7,124 L154.7,242" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a57606a)"/>
<path d="M745.3,124 L745.3,242" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a57606a)"/>
<text x="450" y="150" font-size="12.5" fill="#1f2328" text-anchor="middle">lo, hi: r − b_L and r + b_L widened by 2^−50 (|r| + b_L), rounded outwards to float32;</text>
<text x="450" y="167" font-size="12.5" fill="#1f2328" text-anchor="middle">x' = f(r') = clip(fl32(r' + pred)) is monotone in r',</text>
<text x="450" y="184" font-size="12.5" fill="#1f2328" text-anchor="middle">so f(lo) ≤ f(r') ≤ f(hi) for every r' the codec may return</text>
<rect x="150" y="246" width="600" height="32" fill="#f0f2f4" stroke="#d0d7de" stroke-width="1"/>
<rect x="150" y="246" width="4.7" height="32" fill="#d0d7de" stroke="none" stroke-width="1.0"/>
<rect x="745.3" y="246" width="4.7" height="32" fill="#d0d7de" stroke="none" stroke-width="1.0"/>
<rect x="154.7" y="251" width="590.7" height="22" fill="#d1dfef" stroke="#2f6db5" stroke-width="1.2"/>
<path d="M60,262 L840,262" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<path d="M150,258 L150,266" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<text x="146" y="288" font-size="12" fill="#57606a" text-anchor="end">−1 b</text>
<path d="M750,258 L750,266" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<text x="754" y="288" font-size="12" fill="#57606a">+1 b</text>
<text x="840" y="282" font-size="12.5" fill="#57606a" text-anchor="end">x' − x</text>
<path d="M450,240 L450,284" fill="none" stroke="#1f2328" stroke-width="2"/>
<text x="450" y="302" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">x = 254.3183 K</text>
<text x="160.7" y="267" font-size="12.5" fill="#2f6db5" font-weight="bold">f(lo)</text>
<text x="739.3" y="267" font-size="12.5" fill="#2f6db5" text-anchor="end" font-weight="bold">f(hi)</text>
<text x="758" y="256" font-size="12.5" fill="#57606a">margin m b</text>
<text x="300" y="238" font-size="12.5" fill="#57606a" text-anchor="middle">allowed: |x' − x| ≤ b</text>
<rect x="743.5" y="236" width="8.3" height="52" fill="none" stroke="#1f2328" stroke-width="1" stroke-dasharray="2 2"/>
<text x="20" y="344" font-size="14" fill="#1f2328" font-weight="bold">(b)  the dashed box: float32 values of x' near x + b (spacing 2^−16 K = 0.000305 b here)</text>
<rect x="701.6" y="382" width="158.4" height="52" fill="#faeee4" stroke="none" stroke-width="1.0"/>
<path d="M40,408 L400,408" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<path d="M76,402 L76,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M148,402 L148,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M220,402 L220,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M292,402 L292,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M364,402 L364,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M500,408 L860,408" fill="none" stroke="#8c959f" stroke-width="1.0"/>
<path d="M500,402 L500,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M572,402 L572,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M644,402 L644,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M716,402 L716,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M788,402 L788,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<path d="M860,402 L860,414" fill="none" stroke="#1f2328" stroke-width="1.2"/>
<text x="450" y="413" font-size="16" fill="#1f2328" text-anchor="middle">…</text>
<text x="450" y="436" font-size="12" fill="#57606a" text-anchor="middle">50.8 steps</text>
<path d="M191.2,374 L191.2,442" fill="none" stroke="#57606a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="191.2" y="368" font-size="12.5" fill="#57606a" text-anchor="middle">x + b_L</text>
<path d="M186.3,426 l10,10 m0,-10 l-10,10" fill="none" stroke="#1f2328" stroke-width="1.4"/>
<text x="191.3" y="456" font-size="12.5" fill="#1f2328" text-anchor="middle">hi + pred (exact sum)</text>
<circle cx="220" cy="408" r="6" fill="#2f6db5" stroke="#2f6db5" stroke-width="1.0"/>
<text x="224" y="394" font-size="12.5" fill="#2f6db5" font-weight="bold">f(hi)</text>
<path d="M701.6,374 L701.6,442" fill="none" stroke="#1f2328" stroke-width="2"/>
<text x="701.6" y="368" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="bold">x + b</text>
<path d="M696.7,426 l10,10 m0,-10 l-10,10" fill="none" stroke="#57606a" stroke-width="1.4"/>
<circle cx="716" cy="408" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/>
<text x="716" y="394" font-size="12.5" fill="#1f2328" font-weight="bold">f(hi) with m = 0</text>
<text x="701.7" y="456" font-size="12.5" fill="#57606a" text-anchor="middle">hi + pred with m = 0</text>
<text x="854" y="430" font-size="12.5" fill="#d9711c" text-anchor="end">beyond the bound</text>
<text x="40" y="494" font-size="12.5" fill="#1f2328">With the margin: f(hi) − x = 0.9844971 b and x − f(lo) = 0.9844971 b, both ≤ b: the cell is accepted</text>
<text x="40" y="511" font-size="12.5" fill="#1f2328">(arith.verify checks both ends in every cell). By monotonicity |f(r') − x| ≤ b for every r' the codec may return.</text>
<text x="40" y="554" font-size="12.5" fill="#1f2328">Without it (b_L = b): x + b lies 0.8 steps above a float32 value, so r + b + pred rounds up to the next one:</text>
<text x="40" y="571" font-size="12.5" fill="#1f2328">f(hi) − x = 1.0000610 b &gt; b. That fails here in the 6 cells below 256 K, and one failing cell bypasses the slice.</text>
<text x="40" y="588" font-size="12.5" fill="#1f2328">The margin m b pays for these roundings: half a float32 step of x' and of r, and the widening 2^−50 (|r| + b_L)</text>
<text x="40" y="605" font-size="12.5" fill="#1f2328">of lo and hi (the float32 spacing of r is 1.2e-06 b here).</text>
</svg>
