<text x="544" y="566" font-size="12.5" fill="#1f2328" font-family="monospace">r = fl32(x − pred) = −0.72824097</text>
<text x="532" y="599" font-size="12.5" fill="#1f2328">Header record of the slice: flags 0, c0, c1</text>
<text x="532" y="616" font-size="12.5" fill="#1f2328">(12 bytes). r replaces x in the chunk and the</text>
<text x="532" y="633" font-size="12.5" fill="#1f2328">lattice codec codes it within b_L = b (1 − 2^−6)</text>
<text x="532" y="650" font-size="12.5" fill="#1f2328">≈ 0.0492 K. PMSL gets its own record;</text>
<text x="532" y="667" font-size="12.5" fill="#1f2328">FIS and U_10M pass unchanged.</text>
