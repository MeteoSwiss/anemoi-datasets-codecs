<text x="412" y="824" font-size="12" fill="#57606a">x[:, kept]: a new array, 785 328 B</text>
<text x="652" y="824" font-size="12" fill="#57606a">envelope.pack (kind 0), 785 688 B</text>
<text x="172" y="824" font-size="12" fill="#57606a">the envelope's array</text>
<text x="20" y="857" font-size="12.5" fill="#1f2328" font-weight="bold" font-family="monospace">icon_lattice_bytes</text>
<rect x="172" y="842" width="138.4" height="20" fill="#f0f2f4" stroke="#1f2328" stroke-width="0.8"/>
<rect x="172" y="842" width="1.2" height="20" fill="#1f2328" stroke="none" stroke-width="1.0"/>
<rect x="412" y="842" width="47.5" height="20" fill="#d1dfef" stroke="#2f6db5" stroke-width="0.8"/>
<rect x="652" y="842" width="47.6" height="20" fill="#d1dfef" stroke="#2f6db5" stroke-width="0.8"/>
<rect x="652" y="842" width="1.2" height="20" fill="#1f2328" stroke="none" stroke-width="1.0"/>
