<path d="M614,852 L644,852" fill="none" stroke="#1f2328" stroke-width="1.3" marker-end="url(#a1f2328)"/>
<text x="412" y="876" font-size="12" fill="#57606a">the LATC container, 269 664 B</text>
<text x="652" y="876" font-size="12" fill="#57606a">envelope.pack_bytes (kind 1), 270 024 B</text>
<text x="172" y="876" font-size="12" fill="#57606a">the envelope's array</text>
<text x="20" y="900" font-size="12" fill="#57606a">a stage's input is read-only (it can be the caller's array); bars to scale, the dark end is the envelope prefix</text>
