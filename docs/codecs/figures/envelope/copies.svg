<text x="652" y="772" font-size="12" fill="#57606a">envelope.pack (kind 0), 1 112 668 B</text>
<text x="172" y="772" font-size="12" fill="#57606a">zarr's bare bytes</text>
<text x="20" y="805" font-size="12.5" fill="#1f2328" font-weight="bold" font-family="monospace">static_ref</text>
<rect x="172" y="790" width="196" height="20" fill="#f0f2f4" stroke="#1f2328" stroke-width="0.8"/>
