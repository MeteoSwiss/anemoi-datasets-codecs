<text x="342.5" y="685.5" font-size="12" fill="#1f2328" text-anchor="middle" font-family="monospace">LATC</text>
<text x="244" y="706" font-size="12.5" fill="#1f2328">kind 1, shape (1, 12, 1, 16 361)</text>
<text x="244" y="722" font-size="12.5" fill="#57606a">270 024 B: 360 B prefix + the LATC container</text>
<text x="640" y="286" font-size="12" fill="#1f2328">writes the chunk as little-endian float32</text>
<text x="586" y="402" font-size="12" fill="#57606a" font-weight="bold">create</text>
<text x="640" y="402" font-size="12" fill="#1f2328">float32; 4-D chunks holding every</text>
<text x="640" y="417" font-size="12" fill="#1f2328">field of a date</text>
<text x="586" y="432" font-size="12" fill="#57606a" font-weight="bold">encode</text>
<text x="640" y="432" font-size="12" fill="#1f2328">a bare chunk of the spec's shape;</text>
<text x="640" y="447" font-size="12" fill="#1f2328">17 fields = its variables</text>
<text x="586" y="462" font-size="12" fill="#57606a" font-weight="bold">decode</text>
<text x="640" y="462" font-size="12" fill="#1f2328">top header 'field_terms'? pop it;</text>
<text x="640" y="477" font-size="12" fill="#1f2328">17 fields out; the stack is empty:</text>
<text x="640" y="492" font-size="12" fill="#1f2328">the result has the spec's shape</text>
<text x="586" y="518" font-size="12" fill="#57606a" font-weight="bold">create</text>
<text x="640" y="518" font-size="12" fill="#1f2328">the same as field_terms</text>
<text x="586" y="533" font-size="12" fill="#57606a" font-weight="bold">encode</text>
<text x="640" y="533" font-size="12" fill="#1f2328">kind 0; dates, members and cells =</text>
<text x="640" y="548" font-size="12" fill="#1f2328">the spec's; 17 fields = its variables</text>
<text x="586" y="563" font-size="12" fill="#57606a" font-weight="bold">decode</text>
<text x="640" y="563" font-size="12" fill="#1f2328">top header 'static_ref'? pop it;</text>
<text x="640" y="578" font-size="12" fill="#1f2328">12 fields in; dates, members and</text>
<text x="640" y="593" font-size="12" fill="#1f2328">cells = the spec's</text>
<text x="586" y="634" font-size="12" fill="#57606a" font-weight="bold">create</text>
<text x="640" y="634" font-size="12" fill="#1f2328">float32; 4-D chunks holding every</text>
<text x="640" y="649" font-size="12" fill="#1f2328">field of a date; cells and members</text>
<text x="640" y="664" font-size="12" fill="#1f2328">of its lattice (not the field count)</text>
<text x="586" y="679" font-size="12" fill="#57606a" font-weight="bold">encode</text>
<text x="640" y="679" font-size="12" fill="#1f2328">kind 0; dates, members, cells = the</text>
<text x="640" y="694" font-size="12" fill="#1f2328">spec's; 12 fields = its variables</text>
<text x="586" y="709" font-size="12" fill="#57606a" font-weight="bold">decode</text>
<text x="640" y="709" font-size="12" fill="#1f2328">kind 1; the same shape checks</text>
<text x="640" y="750" font-size="12" fill="#1f2328">stores the bytes it is given</text>
