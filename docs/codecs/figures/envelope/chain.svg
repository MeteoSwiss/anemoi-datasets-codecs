<text x="20" y="26" font-size="14" fill="#1f2328" font-weight="bold">one chunk through compressors=[field_terms, static_ref, icon_lattice_bytes]</text>
<rect x="20" y="40" width="860" height="62" rx="6" fill="#f0f2f4" stroke="#8c959f" stroke-width="1"/>
<text x="32" y="60" font-size="12.5" fill="#1f2328" font-weight="bold">zarr gives every codec the same chunk spec, the array's: (1, 17, 1, 16 361) float32</text>
<text x="32" y="78" font-size="12.5" fill="#1f2328">at array creation (validate, against the chunk grid) and for every chunk (chunk_spec, "spec" below). No</text>
<text x="32" y="94" font-size="12.5" fill="#1f2328">codec announces another shape (the stages keep resolve_metadata the identity): it travels in the envelope.</text>
<text x="20" y="140" font-size="12.5" fill="#57606a" font-weight="bold">codec</text>
<text x="244" y="140" font-size="12.5" fill="#57606a" font-weight="bold">what passes between two codecs</text>
<text x="586" y="140" font-size="12.5" fill="#57606a" font-weight="bold">what the codec checks</text>
<rect x="20" y="156" width="200" height="40" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="120" y="173" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">chunk of the array</text>
<text x="120" y="189" font-size="12" fill="#57606a" text-anchor="middle">NDBuffer (1, 17, 1, 16 361)</text>
<rect x="20" y="272" width="200" height="40" rx="6" fill="#f0f2f4" stroke="#1f2328" stroke-width="1.4"/>
<text x="120" y="289" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="monospace">bytes</text>
<text x="120" y="305" font-size="12" fill="#57606a" text-anchor="middle">zarr's array → bytes</text>
<rect x="20" y="388" width="200" height="40" rx="6" fill="#f0f2f4" stroke="#d9711c" stroke-width="1.4"/>
<text x="120" y="405" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="monospace">field_terms</text>
<text x="120" y="421" font-size="12" fill="#57606a" text-anchor="middle">targets → residuals</text>
<rect x="20" y="504" width="200" height="40" rx="6" fill="#f0f2f4" stroke="#2e8b57" stroke-width="1.4"/>
<text x="120" y="521" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="monospace">static_ref</text>
<text x="120" y="537" font-size="12" fill="#57606a" text-anchor="middle">drops the static fields</text>
<rect x="20" y="620" width="200" height="40" rx="6" fill="#f0f2f4" stroke="#1f2328" stroke-width="1.4"/>
<text x="120" y="637" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="monospace">icon_lattice_bytes</text>
<text x="120" y="653" font-size="12" fill="#57606a" text-anchor="middle">lattice codec, chain: true</text>
<rect x="20" y="736" width="200" height="40" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="120" y="753" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold">store</text>
<text x="120" y="769" font-size="12" fill="#57606a" text-anchor="middle">the chunk file</text>
