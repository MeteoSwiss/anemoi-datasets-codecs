<svg xmlns="http://www.w3.org/2000/svg" width="900" height="668" viewBox="0 0 900 668" font-family="sans-serif">
<title>Envelope version 1, byte layout</title>
<rect x="0" y="0" width="900" height="668" fill="#ffffff"/>
<text x="20" y="28" font-size="14" fill="#1f2328" font-weight="bold">(a)  the stored chunk of the chain: head, bytes 0 to 24 (integers little endian)</text>
<rect x="30" y="58" width="140" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="100" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">FCHN</text>
<text x="100" y="91" font-size="12" fill="#57606a" text-anchor="middle">4 B</text>
<text x="32" y="52" font-size="12" fill="#57606a">0</text>
<text x="100" y="114" font-size="12" fill="#1f2328" text-anchor="middle">magic</text>
<rect x="170" y="58" width="35" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="187.5" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">1</text>
<text x="187.5" y="91" font-size="12" fill="#57606a" text-anchor="middle">u8</text>
<text x="172" y="52" font-size="12" fill="#57606a">4</text>
<text x="187.5" y="114" font-size="12" fill="#1f2328" text-anchor="middle">version</text>
<rect x="205" y="58" width="35" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="222.5" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">4</text>
<text x="222.5" y="91" font-size="12" fill="#57606a" text-anchor="middle">u8</text>
<text x="207" y="52" font-size="12" fill="#57606a">5</text>
<text x="222.5" y="130" font-size="12" fill="#1f2328" text-anchor="middle">ndim</text>
<rect x="240" y="58" width="35" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="257.5" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">1</text>
<text x="257.5" y="91" font-size="12" fill="#57606a" text-anchor="middle">u8</text>
<text x="242" y="52" font-size="12" fill="#57606a">6</text>
<text x="257.5" y="114" font-size="12" fill="#1f2328" text-anchor="middle">kind</text>
<rect x="275" y="58" width="35" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="292.5" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">0</text>
<text x="292.5" y="91" font-size="12" fill="#57606a" text-anchor="middle">u8</text>
<text x="277" y="52" font-size="12" fill="#57606a">7</text>
<text x="292.5" y="130" font-size="12" fill="#1f2328" text-anchor="middle">reserved</text>
<rect x="310" y="58" width="70" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="345" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">2</text>
<text x="345" y="91" font-size="12" fill="#57606a" text-anchor="middle">u16</text>
<text x="312" y="52" font-size="12" fill="#57606a">8</text>
<text x="345" y="114" font-size="12" fill="#1f2328" text-anchor="middle">n_headers</text>
<rect x="380" y="58" width="70" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="415" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">0</text>
<text x="415" y="91" font-size="12" fill="#57606a" text-anchor="middle">u16</text>
<text x="382" y="52" font-size="12" fill="#57606a">10</text>
<text x="415" y="130" font-size="12" fill="#1f2328" text-anchor="middle">reserved</text>
<rect x="450" y="58" width="140" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="520" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">360</text>
<text x="520" y="91" font-size="12" fill="#57606a" text-anchor="middle">u32</text>
<text x="452" y="52" font-size="12" fill="#57606a">12</text>
<text x="520" y="114" font-size="12" fill="#1f2328" text-anchor="middle">header_bytes</text>
<rect x="590" y="58" width="280" height="40" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="730" y="76" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">269 664</text>
<text x="730" y="91" font-size="12" fill="#57606a" text-anchor="middle">u64</text>
<text x="592" y="52" font-size="12" fill="#57606a">16</text>
<text x="730" y="114" font-size="12" fill="#1f2328" text-anchor="middle">payload_bytes</text>
<text x="870" y="52" font-size="12" fill="#57606a" text-anchor="end">24</text>
<text x="30" y="150" font-size="12" fill="#57606a">kind 1: the payload is opaque bytes a later codec wrote (kind 0: a float32 array of the shape)</text>
<text x="20" y="194" font-size="14" fill="#1f2328" font-weight="bold">(b)  the prefix, bytes 0 to header_bytes = 360, to scale</text>
<rect x="30" y="230" width="56" height="36" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="58" y="253" font-size="12.5" fill="#1f2328" text-anchor="middle">head</text>
<rect x="86" y="230" width="74.7" height="36" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="123.3" y="253" font-size="12.5" fill="#1f2328" text-anchor="middle">shape</text>
<rect x="160.7" y="230" width="18.7" height="36" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<rect x="179.3" y="230" width="25.7" height="36" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<rect x="205" y="230" width="102.7" height="36" fill="#f6dcc6" stroke="#d9711c" stroke-width="1.2"/>
<rect x="307.7" y="230" width="2.3" height="36" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
<text x="256.3" y="253" font-size="12.5" fill="#1f2328" text-anchor="middle">44 B</text>
<text x="162.7" y="224" font-size="12" fill="#57606a">56</text>
<text x="235.3" y="284" font-size="12.5" fill="#1f2328" text-anchor="middle">record of field_terms</text>
<rect x="310" y="230" width="18.7" height="36" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<rect x="328.7" y="230" width="23.3" height="36" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<rect x="352" y="230" width="504" height="36" fill="#d1e5da" stroke="#2e8b57" stroke-width="1.2"/>
<rect x="856" y="230" width="14" height="36" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
<text x="604" y="253" font-size="12.5" fill="#1f2328" text-anchor="middle">216 B</text>
<text x="312" y="224" font-size="12" fill="#57606a">120</text>
<text x="590" y="284" font-size="12.5" fill="#1f2328" text-anchor="middle">record of static_ref</text>
<text x="30" y="224" font-size="12" fill="#57606a">0</text>
<text x="88" y="224" font-size="12" fill="#57606a">24</text>
<text x="870" y="224" font-size="12" fill="#57606a" text-anchor="end">360</text>
<text x="95.3" y="284" font-size="12.5" fill="#1f2328" text-anchor="middle">i64 × 4: 1, 12, 1, 16 361</text>
<text x="20" y="332" font-size="14" fill="#1f2328" font-weight="bold">(c)  the header records, bottom of the stack first (not to scale)</text>
<rect x="30" y="366" width="64" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="62" y="387" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">11</text>
<text x="32" y="361" font-size="12" fill="#57606a">56</text>
<rect x="94" y="366" width="64" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="126" y="387" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">0</text>
<text x="96" y="361" font-size="12" fill="#57606a">58</text>
<rect x="158" y="366" width="76" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="196" y="387" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">44</text>
<text x="160" y="361" font-size="12" fill="#57606a">60</text>
<rect x="234" y="366" width="150" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="309" y="387" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">field_terms</text>
<text x="236" y="361" font-size="12" fill="#57606a">64</text>
<rect x="384" y="366" width="300" height="32" fill="#f6dcc6" stroke="#d9711c" stroke-width="1.2"/>
<text x="534" y="387" font-size="12.5" fill="#1f2328" text-anchor="middle">2 terms, 1 slice: term table + coefficients</text>
<text x="386" y="361" font-size="12" fill="#57606a">75</text>
<rect x="684" y="366" width="100" height="32" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
<text x="734" y="387" font-size="12.5" fill="#1f2328" text-anchor="middle">1 B</text>
<text x="686" y="361" font-size="12" fill="#57606a">119</text>
<text x="784" y="361" font-size="12" fill="#57606a" text-anchor="end">120</text>
<rect x="30" y="420" width="64" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="62" y="441" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">10</text>
<text x="32" y="415" font-size="12" fill="#57606a">120</text>
<rect x="94" y="420" width="64" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="126" y="441" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">0</text>
<text x="96" y="415" font-size="12" fill="#57606a">122</text>
<rect x="158" y="420" width="76" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="196" y="441" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">216</text>
<text x="160" y="415" font-size="12" fill="#57606a">124</text>
<rect x="234" y="420" width="150" height="32" fill="#d0d7de" stroke="#1f2328" stroke-width="1"/>
<text x="309" y="441" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="monospace">static_ref</text>
<text x="236" y="415" font-size="12" fill="#57606a">128</text>
<rect x="384" y="420" width="300" height="32" fill="#d1e5da" stroke="#2e8b57" stroke-width="1.2"/>
<text x="534" y="441" font-size="12.5" fill="#1f2328" text-anchor="middle">5 slots: reference + sha256</text>
<text x="386" y="415" font-size="12" fill="#57606a">138</text>
<rect x="684" y="420" width="100" height="32" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
<text x="734" y="441" font-size="12.5" fill="#1f2328" text-anchor="middle">6 B</text>
<text x="686" y="415" font-size="12" fill="#57606a">354</text>
<text x="784" y="415" font-size="12" fill="#57606a" text-anchor="end">360</text>
<text x="62" y="468" font-size="12" fill="#57606a" text-anchor="middle">u16 n</text>
<text x="126" y="468" font-size="12" fill="#57606a" text-anchor="middle">u16 0</text>
<text x="196" y="468" font-size="12" fill="#57606a" text-anchor="middle">u32 m</text>
<text x="309" y="468" font-size="12" fill="#57606a" text-anchor="middle">stage id, n B</text>
<text x="534" y="468" font-size="12" fill="#57606a" text-anchor="middle">header payload, m B</text>
<text x="734" y="468" font-size="12" fill="#57606a" text-anchor="middle">0-pad to 8</text>
<text x="30" y="488" font-size="12.5" fill="#1f2328">a header payload is written and read by its stage only (its own frozen format); the envelope does not read it</text>
<text x="20" y="526" font-size="14" fill="#1f2328" font-weight="bold">(d)  the whole stored chunk, 270 024 bytes, to scale</text>
<rect x="30" y="544" width="840" height="26" fill="#d1dfef" stroke="#2f6db5" stroke-width="1"/>
<rect x="30" y="544" width="1.5" height="26" fill="#1f2328" stroke="none" stroke-width="1.0"/>
<text x="450" y="562" font-size="12.5" fill="#1f2328" text-anchor="middle">payload at 360, kind 1: the LATC container (container version 3), 269 664 B</text>
<text x="30" y="588" font-size="12" fill="#57606a">the prefix: 360 B, 0.13 % of the chunk; the payload starts 8-byte aligned</text>
<rect x="20" y="608" width="860" height="50" rx="6" fill="#f0f2f4" stroke="#1f2328" stroke-width="1.2"/>
<text x="32" y="628" font-size="12.5" fill="#1f2328" font-weight="bold">frozen (envelope version 1): the magic, every offset, type and order above, the payload kinds, the padding to 8.</text>
<text x="32" y="646" font-size="12.5" fill="#1f2328">not the envelope's: the header payloads (each stage freezes its own) and a kind 1 payload (the LATC container).</text>
</svg>
