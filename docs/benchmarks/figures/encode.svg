<rect x="190" y="146" width="367.5" height="18" fill="#2f6db5" stroke="none" stroke-width="1.0"/>
<text x="565.5" y="159" font-size="12.5" fill="#1f2328">44.1 s</text>
<text x="180" y="185" font-size="12.5" fill="#1f2328" text-anchor="end">date 13</text>
<rect x="190" y="172" width="362.5" height="18" fill="#2f6db5" stroke="none" stroke-width="1.0"/>
<text x="560.5" y="185" font-size="12.5" fill="#1f2328">43.5 s</text>
<text x="180" y="211" font-size="12.5" fill="#1f2328" text-anchor="end">date 19</text>
<rect x="190" y="198" width="353.3" height="18" fill="#2f6db5" stroke="none" stroke-width="1.0"/>
