<svg xmlns="http://www.w3.org/2000/svg" width="900" height="622" viewBox="0 0 900 622" font-family="sans-serif">
<title>Encode time per ICON-CH1 date</title>
<rect x="0" y="0" width="900" height="622" fill="#ffffff"/>
<text x="20" y="26" font-size="16" fill="#1f2328" font-weight="bold">Encode time per date, ICON-CH1</text>
<text x="20" y="46" font-size="12.5" fill="#57606a">Python / numpy encoder with C passes, fitting and verification included.</text>
<text x="20" y="78" font-size="14" fill="#1f2328" font-weight="bold">(a)  LatticeCodec.encode of one sample date: range over its encodes</text>
