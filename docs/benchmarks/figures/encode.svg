<path d="M690,92 L690,348" fill="none" stroke="#f0f2f4" stroke-width="1"/>
<text x="180" y="110" font-size="12.5" fill="#57606a" text-anchor="end" font-weight="bold">1 thread</text>
<text x="180" y="133" font-size="12.5" fill="#1f2328" text-anchor="end">date 0</text>
