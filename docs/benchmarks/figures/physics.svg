<rect x="250" y="429" width="12" height="12" fill="#2f6db5" stroke="none" stroke-width="1"/>
<text x="268" y="438" font-size="12.5" fill="#1f2328">tree k = 1</text>
<rect x="356.5" y="429" width="12" height="12" fill="#8dafd6" stroke="none" stroke-width="1"/>
<text x="374.5" y="438" font-size="12.5" fill="#1f2328">tree_b k = 3</text>
<text x="20" y="466" font-size="12" fill="#57606a">Physics layer table (scripts/physics_size.py); every chunk decoded and checked against the bounds.</text>
<text x="20" y="482" font-size="12" fill="#57606a">The settings nest: cross: off removes the three kinds above it, physics: off everything. Without valid dates, recipe_fit or</text>
<text x="20" y="498" font-size="12" fill="#57606a">a bound for the forcings, the forcings are lossless anyway, so there the layer is worth the cross terms, 11-12% of a chunk.</text>
<text x="20" y="514" font-size="12" fill="#57606a">The worst error / bound is the same in every setting.</text>
</svg>
