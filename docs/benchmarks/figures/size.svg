<text x="82" y="542" font-size="12.5" fill="#57606a">the bytes it costs are the trade-off.</text>
<text x="20" y="680" font-size="12" fill="#57606a">(a) Zarr writes of the codec-chains run (rounding: grid, forcings lossless); the defaults (rounding: direct,</text>
<text x="20" y="696" font-size="12" fill="#57606a">physics.recipe_fit: true) from the configuration-choices run through the engine without dates (the bytes a zarr write</text>
<text x="20" y="712" font-size="12" fill="#57606a">gives); the two 'with dates' bars from the physics-layer run (rounding: grid, scripts/physics_size.py); raw float32 from</text>
<text x="20" y="728" font-size="12" fill="#57606a">the shape. The ratio is to the 298.95 MiB of the Blosc store of date 6.</text>
<text x="20" y="744" font-size="12" fill="#57606a">(b) Structure table: rounding: grid, forcings as recipes, statics referenced; the worst error / bound is 1 / k in every</text>
<text x="20" y="760" font-size="12" fill="#57606a">row. The RMSE / bound of each configuration is in the Configuration choices and Physics layer sections.</text>
</svg>
