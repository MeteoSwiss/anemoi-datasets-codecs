<rect x="448.8" y="759" width="12" height="12" fill="#2e8b57" stroke="none" stroke-width="1"/>
<text x="466.8" y="768" font-size="12.5" fill="#1f2328">static_ref (one write of the 115-field date)</text>
<rect x="190" y="779" width="12" height="12" fill="#d9711c" stroke="none" stroke-width="1"/>
<text x="208" y="788" font-size="12.5" fill="#1f2328">field_terms (six targets, in place)</text>
<text x="20" y="818" font-size="12" fill="#57606a">(a) One real chunk written at the defaults (31.2 MiB, 115 fields) decoded into a preallocated buffer, 3 interleaved rounds</text>
<text x="20" y="834" font-size="12" fill="#57606a">in separate processes. The Blosc library decodes a date in about 90 ms on one core and 13-26 ms on 16-32 threads.</text>
<text x="20" y="850" font-size="12" fill="#57606a">(b) Stores written at the defaults, the chains without a forcing bound; a[...] after two warm-up reads, best / median of 3</text>
<text x="20" y="866" font-size="12" fill="#57606a">rounds of 7, each round and thread count in its own process; Blosc with as many threads. Every store decodes to the same</text>
<text x="20" y="882" font-size="12" fill="#57606a">bits at every thread count.</text>
<text x="20" y="898" font-size="12" fill="#57606a">(c) The stages of one read of an earlier run (rounding: grid); the envelope is well under 1 ms. static_ref is</text>
<text x="20" y="914" font-size="12" fill="#57606a">single-threaded numpy, so at 16 threads it is most of the chain's extra time over the single codec.</text>
