exclude: ^tests/data/  # frozen baselines, byte for byte (some without a final newline): never rewritten
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-added-large-files
  - id: check-merge-conflict
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3  # the ruff of uv.lock
  hooks:
  - id: ruff-check
  - id: ruff-format
